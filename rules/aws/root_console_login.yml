title: AWS Root Account Console Login
id: 4d6c8a1e-0b7f-4c1e-9f1a-1a2b3c4d5e02
status: stable
description: Detects interactive console sign-in by the root user, which should be break-glass only.
author: DBK7
date: 2026-11-06
references:
  - https://attack.mitre.org/techniques/T1078/004/
tags:
  - attack.initial-access
  - attack.privilege-escalation
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    userIdentity.type: Root
  condition: selection
falsepositives:
  - Documented break-glass use
level: high
