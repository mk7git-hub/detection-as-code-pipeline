title: CloudTrail Logging Stopped or Deleted
id: 4d6c8a1e-0b7f-4c1e-9f1a-1a2b3c4d5e01
status: stable
description: Detects an attempt to stop or delete a CloudTrail trail, a common defense-evasion step after initial access.
author: DBK7
date: 2026-11-06
references:
  - https://attack.mitre.org/techniques/T1562/008/
tags:
  - attack.defense-evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: cloudtrail.amazonaws.com
    eventName:
      - StopLogging
      - DeleteTrail
      - UpdateTrail
  condition: selection
falsepositives:
  - Planned trail changes by the platform team through IaC
level: high
