title: Secrets Manager Secret Values Listed and Read
id: 4d6c8a1e-0b7f-4c1e-9f1a-1a2b3c4d5e08
status: experimental
description: Detects reading secret values from AWS Secrets Manager by a human console session, a credential-access pattern.
author: DBK7
date: 2026-11-06
references:
  - https://attack.mitre.org/techniques/T1555/006/
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName:
      - GetSecretValue
      - BatchGetSecretValue
    sessionCredentialFromConsole: 'true'
  condition: selection
falsepositives:
  - Engineers retrieving secrets during break-fix
level: low
